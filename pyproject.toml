[project]
name = "worldquant-brain-simulator"
version = "0.1.0"
description = "A modern NumPy/Polars batch simulator for WorldQuant BRAIN-style alphas."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "polars>=1.40.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "typer>=0.20.0",
]

[project.scripts]
wqsim = "wqsim.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wqsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
